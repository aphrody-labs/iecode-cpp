name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, ext: tar.gz }
          - { os: windows-latest, rid: win-x64, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/native-build
        with:
          lto: "ON"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find build -name 'iecode' -type f -o -name 'iecode.exe' -type f | head -n 1)
          test -n "$bin"
          stage="stage/iecode-cpp-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          mkdir -p "$stage" dist
          cp "$bin" LICENSE README.md "$stage/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd stage && 7z a -tzip "$GITHUB_WORKSPACE/dist/iecode-cpp-${GITHUB_REF_NAME}-${{ matrix.rid }}.zip" "iecode-cpp-${GITHUB_REF_NAME}-${{ matrix.rid }}" >/dev/null)
          else
            tar -C stage -czf "dist/iecode-cpp-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" "iecode-cpp-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
